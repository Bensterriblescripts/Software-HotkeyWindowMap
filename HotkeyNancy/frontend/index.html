<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/wails.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/style.css"/>
    <title>Hotkey Nancy</title>
</head>
<body>
<div id="container">
    <nav id="navbar">
        <div class="navbar-links">
            <a class="nav-link active" data-page="hotkeys">Hotkeys</a>
            <a class="nav-link" data-page="repositories">Repositories</a>
            <a class="nav-link" data-page="storage">Storage</a>
            <a class="nav-link" data-page="config">Config</a>
            <a class="nav-link" data-page="logs">Logs</a>
        </div>
    </nav>
    <div id="page-actions">
        <button id="nav-btn-refresh" class="icon-btn" onclick="refreshWindows()" title="Refresh">&#x21bb;</button>
    </div>
    <div id="main" class="card"></div>
</div>
<script type="module">
    import {HotkeyService} from "/bindings/hotkeynancy";
    let activeWindows = null;
    let activeHotkeys = null;
    const lastSetHotkey = {};
    const mainDiv = document.getElementById('main');

    document.addEventListener('click', (e) => {
        if (!e.target.classList.contains('nav-link')) return;
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        e.target.classList.add('active');
        const page = e.target.getAttribute('data-page');
        const refreshBtn = document.getElementById('nav-btn-refresh');
        if (page === 'hotkeys') {
            refreshBtn.style.display = '';
            setActiveWindows();
        } else {
            refreshBtn.style.display = 'none';
            mainDiv.innerHTML = '<div class="result">Coming soon</div>';
        }
    });

    window.onload = async () => { // Refresh windows on focus or hover
        try {
            await setActiveWindows();
        } catch (err) {
            console.error(err);
            document.getElementById('main').innerHTML = `<div class="result">Unable to retrieve active windows</div>`;
        }
    }
    window.toggleBorderlessFullscreen = async (button) => {
        try {
            const currentState = button.parentElement.getAttribute('current-state');
            const handle = button.parentElement.getAttribute('handle');
            console.log('Current state: ' + currentState);
            if (currentState === 'Borderless (Via Application)') {
                console.log("Window borderless is managed by the application, skipping");
                return;
            } else if (currentState === 'Borderless' || currentState === 'Fullscreen') {
                console.log('Setting: Windowed');
                await HotkeyService.SetWindowed(parseInt(handle));
                button.innerText = 'Borderless';
                button.parentElement.setAttribute('current-state', 'Windowed');
                button.classList.remove('active');
            } else if (currentState === 'Windowed') {
                console.log('Setting: Borderless');
                await HotkeyService.SetBorderlessFullscreen(parseInt(handle));
                button.innerText = 'Windowed';
                button.parentElement.setAttribute('current-state', 'Borderless');
                button.classList.add('active');
            } else {
                console.log("Unknown state: " + currentState);
            }
        } catch (err) {
            alert(`Error: ${err}`);
            button.innerText = 'Error';
        }
    }
    window.refreshWindows = async () => {
        try {
            await setActiveWindows();
        } catch (err) {
            console.error(err);
            mainDiv.innerHTML = `<div class="result">Unable to retrieve active windows</div>`;
        }
    }
    window.toggleFocus = async (element) => {
        try {
            const handle = element.id;
            await HotkeyService.SetFocus(parseInt(handle));
        } catch (err) {
            alert(`Error: ${err}`);
        }
    }
    window.toggleHotkeyPanel = (button) => {
        const hotkeyGroup = button.nextElementSibling;
        const isOpen = hotkeyGroup.classList.toggle('visible');
        if (isOpen) {
            button.dataset.originalText = button.innerText;
            button.innerText = '\u2715';
            button.classList.add('hotkey-close');
        } else {
            button.innerText = button.dataset.originalText || 'Hotkey';
            button.classList.remove('hotkey-close');
        }
    }
    document.addEventListener('keyup', async (e) => {
        if (e.key === 'Enter' && e.target.placeholder === 'Key') {
            console.log("Triggered enter key event on hotkey input")
            const hndle = e.target.id.split('-')[1];
            await setHotkey(document.getElementById(hndle).getAttribute('executable'), document.getElementById('modifier-' + hndle).value, e.target.value);
        }
    });
    document.addEventListener('focusout', async (e) => {
        if (e.target.placeholder === 'Key') {
            console.log("Triggered focusout event on hotkey input")
            const hndle = e.target.id.split('-')[1];
            await setHotkey(document.getElementById(hndle).getAttribute('executable'), document.getElementById('modifier-' + hndle).value, e.target.value);
        }
    });
    window.changeHotkey = async (select) => {
        console.log("Triggered change event on modifier select")
        const hndle = select.id.split('-')[1];
        const executable = document.getElementById(hndle).getAttribute('executable');
        if (select.value === "") {
            await HotkeyService.SetHotkey(executable, "", "");
            return;
        }
        await setHotkey(executable, select.value, document.getElementById('key-' + hndle).value);
    }

    async function setHotkey(execpath, modifier, key) {
        if (execpath === null || execpath === '') {
            console.log("No executable path provided");
            return;
        }
        if (modifier === null || modifier === '') {
            console.log("No modifier provided");
            return;
        }
        if (key === null || key === '') {
            console.log("No key provided");
            return;
        }
        key = key.charAt(0);

        const dedupeKey = execpath + '|' + modifier + '|' + key;
        if (lastSetHotkey[execpath] === dedupeKey) {
            console.log("Hotkey unchanged, skipping duplicate call");
            return;
        }
        lastSetHotkey[execpath] = dedupeKey;

        await HotkeyService.SetHotkey(execpath, modifier, key);
    }
    async function setActiveWindows() {
        activeWindows = await HotkeyService.GetAllActiveWindows();
        activeHotkeys = await HotkeyService.GetAllHotkeys();

        
        if (activeWindows === null || activeWindows.length === 0) {
            mainDiv.innerHTML = `<div class="result">No active windows found</div>`;
        } else {
            mainDiv.innerHTML = '';
            for (const window of activeWindows) {
                const windowItem = document.createElement('div');
                windowItem.className = 'window-item';

                let buttonText = 'Error';
                let classActive = '';
                if (window.WindowState === 'Borderless' || window.WindowState === 'Fullscreen') {
                    buttonText = 'Windowed';
                    classActive = '';
                } else if (window.WindowState === 'Windowed') {
                    buttonText = 'Borderless';
                    classActive = '';
                } else if (window.WindowState === 'Borderless (Via Application)') {
                    buttonText = 'App Managed';
                    classActive = 'active';
                }

                if (activeHotkeys[window.Executable] === undefined) {
                    activeHotkeys[window.Executable] = ['', ''];
                }

                const windowHandle = window.Handle.toString();
                const hasHotkey = activeHotkeys[window.Executable] && activeHotkeys[window.Executable][0] !== '' ? ' has-hotkey' : '';

                windowItem.innerHTML = `
                    <div id="${windowHandle}" executable="${window.Executable}" class="window-title" onclick="toggleFocus(this)" title="${window.Title}">${window.Title}</div>
                    <div class="window-controls" current-state="${window.WindowState}" handle="${windowHandle}">
                        <button class="hotkey-toggle-btn${hasHotkey}" onclick="toggleHotkeyPanel(this)" title="Set Hotkey">Hotkey</button>
                        <div class="hotkey-group">
                            <select id="modifier-${windowHandle}" class="modifier-select" onchange="changeHotkey(this)">
                                <option value="" selected>None</option>
                                <option value="control">Ctrl</option>
                                <option value="alt">Alt</option>
                                <option value="shift">Shift</option>
                                <option value="control+alt">Ctrl+Alt</option>
                                <option value="control+shift">Ctrl+Shift</option>
                                <option value="alt+shift">Alt+Shift</option>
                            </select>
                            <span class="hotkey-separator">+</span>
                            <input type="text" id="key-${windowHandle}" class="hotkey-letter" placeholder="Key" maxlength="1">
                        </div>
                        <button class="borderless-btn ${classActive}" onclick="toggleBorderlessFullscreen(this)" handle="${windowHandle}" ${window.WindowState === 'Borderless (Via Application)' ? 'disabled' : ''}>${buttonText}</button>
                    </div>
                `;
                mainDiv.appendChild(windowItem);

                const hotkeyData = activeHotkeys[window.Executable];
                if (hotkeyData && hotkeyData[0] !== '') {
                    document.getElementById('modifier-' + windowHandle).value = hotkeyData[0];
                    document.getElementById('key-' + windowHandle).value = hotkeyData[1];
                }
            }
        }
        console.log("Finished retrieving active windows");
    }
</script>
</body>
</html>
